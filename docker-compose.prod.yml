services:
  app:
    build:
      context: .
      target: production
    ports:
      - "80:8080"
    environment:
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
    volumes:
      - app-storage:/var/www/html/storage
      - app-db:/var/www/html/database  

volumes:
  app-storage:
  app-db:
