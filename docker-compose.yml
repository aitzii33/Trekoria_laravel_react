version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: trekoria
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: trekoria
      MYSQL_PASSWORD: root
    ports:
      - "33060:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: